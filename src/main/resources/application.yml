server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: meal-accounting-backend
  datasource:
    url: jdbc:mysql://localhost:3306/meal_accounting?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  redis:
    host: localhost
    port: 6379
    password: 
    database: 0
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.accounting.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.accounting: debug

jwt:
  secret: mySecretKey123456789012345678901234567890
  expiration: 2592000  # 30天（30 * 24 * 60 * 60 = 2592000 秒）

# 阿里云百炼 AI 配置
aliyun:
  bailian:
    # API Key - 从环境变量读取，如果没有则使用默认值（请在生产环境使用环境变量）
    # 方式1：使用环境变量（推荐）
    api-key: ${BAILIAN_API_KEY:sk-9a347114b9a54885a5e8008cab3203bd}
    # 方式2：直接配置（不推荐，仅用于开发测试）
    # api-key: sk-9a347114b9a54885a5e8008cab3203bd
    # API 端点
    api-url: https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation
    # 模型名称（通义千问）
    model: qwen-turbo
    # 请求超时时间（毫秒）
    timeout: 30000
    # 最大 token 数
    max-tokens: 2000
    # 温度参数（0-1，控制随机性）
    temperature: 0.7

