server:
  port: ${SERVER_PORT:8080}  # 生产环境端口，可通过环境变量 SERVER_PORT 配置
  address: 0.0.0.0

spring:
  application:
    name: meal-accounting-backend
  datasource:
    # 数据库配置 - 使用环境变量（生产环境必须配置）
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:meal_accounting}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}  # 必须通过环境变量配置
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  redis:
    # Redis 配置 - 使用环境变量（生产环境必须配置）
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}  # 如果 Redis 有密码，通过环境变量配置
    database: ${REDIS_DATABASE:0}
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.accounting.entity
  configuration:
    map-underscore-to-camel-case: true
    # 生产环境关闭 SQL 日志输出
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    # 生产环境使用 info 级别，减少日志输出
    com.accounting: info
    root: warn

jwt:
  # JWT 密钥 - 生产环境建议通过环境变量配置
  secret: ${JWT_SECRET:mySecretKey123456789012345678901234567890}
  expiration: 2592000  # 30天

# 阿里云百炼 AI 配置
aliyun:
  bailian:
    # API Key - 必须通过环境变量配置（生产环境）
    api-key: ${BAILIAN_API_KEY}
    api-url: https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation
    model: qwen-turbo
    timeout: 30000
    max-tokens: 2000
    temperature: 0.7

